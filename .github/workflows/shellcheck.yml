name: shellcheck

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run shellcheck
        run: >-
          shellcheck -x -P SCRIPTDIR
          install.sh
          lib/common.sh
          ozsh/scripts/*.sh
          git/scripts/*.sh
          tests/run.sh

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run test suite
        run: bash tests/run.sh
